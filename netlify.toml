# Configurazione deploy Netlify per il sito Astro.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# la radice reindirizza alla home inglese
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true

# Guaviare: vecchio slug -> nuovo slug (per non perdere eventuali link/indicizzazioni)
[[redirects]]
  from = "/:lang/journal/guaviare"
  to = "/:lang/journal/guaviare-giungla-colombia-guida"
  status = 301

# /portfolio va direttamente alla prima categoria (niente pagina-ponte bianca)
[[redirects]]
  from = "/en/portfolio"
  to = "/en/portfolio/nature"
  status = 301
  force = true
[[redirects]]
  from = "/it/portfolio"
  to = "/it/portfolio/nature"
  status = 301
  force = true
[[redirects]]
  from = "/es/portfolio"
  to = "/es/portfolio/nature"
  status = 301
  force = true
